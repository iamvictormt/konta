services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-konta}
      POSTGRES_USER: ${POSTGRES_USER:-konta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konta_local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - konta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konta} -d ${POSTGRES_DB:-konta}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  konta-postgres-data:
